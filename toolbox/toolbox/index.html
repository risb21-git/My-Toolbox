<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToolBox – Free PDF, Image &amp; Text Tools</title>
  <meta name="description" content="Free browser-based tools: compress images, merge and split PDFs, convert files and more. Nothing is uploaded.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="menuBtn" class="icon" aria-label="Toggle menu">☰</button>
    <a class="brand" href="#/">🧰 ToolBox</a>
    <input id="search" type="search" placeholder="Search tools…" aria-label="Search tools">
  </header>

  <div class="layout">
    <nav id="nav" aria-label="Tools"></nav>
    <main id="main"></main>
  </div>

  <footer>🔒 Everything runs in your browser. Your files are never uploaded.</footer>

  <!-- Libraries (loaded from CDN, all free / open source) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
